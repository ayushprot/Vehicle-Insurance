# Set a custom name for the Camel Context
camel.springboot.name=MySpringCamelApp

# Keep the application running even without a web server
camel.springboot.main-run-controller=true
debug=true

# Enable virtual threads (Camel 4.x on JDK 21+)
spring.threads.virtual.enabled=true
camel.servlet.mapping.context-path=/camel/*
spring.datasource.url=jdbc:mysql://localhost/assignment?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.platform=mysql
spring.datasource.initialization-mode=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true 